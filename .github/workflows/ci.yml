name: CI - AnalyticsService

on:
  push:
    branches: [ test, main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout code
        uses: actions/checkout@v3

      - name:  Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name:  Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name:  Lint (opcional)
        run: |
          echo "No lint step yet — you can add flake8 or ruff here"

      - name:  Build Docker image
        run: docker build -t analytics-service .

      - name:  Success message
        run: echo "CI passed! Docker image built successfully."
