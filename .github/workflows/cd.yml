name: CD - Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout code
        uses: actions/checkout@v3

      - name:  Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name:  Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name:  Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/analytics-service:latest

      - name:  Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 34.236.133.255
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/analytics-service:latest

            # Stop and remove existing container (if any)
            docker stop analytics-api || true
            docker rm analytics-api || true

            # Run the new container
            docker run -d -p 8000:8000 --name analytics-api ${{ secrets.DOCKER_USERNAME }}/analytics-service:latest
